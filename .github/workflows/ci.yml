name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The core is stdlib-only and the smoke test uses a mock adapter and a
      # scripted judge, so CI needs no GPU, no network and no gateway key.
      - run: pytest -q
      - name: golden set is intact
        run: rag-eval dataset-check
      # The PDFs are gitignored (~15 MB), so a normal checkout has the manifest
      # but no documents. Check them only where they have actually been fetched;
      # wherever they are present, a mismatch fails the build.
      - name: Hansard corpus is intact
        run: |
          if ls datasets/hansard_pdfs/*.pdf >/dev/null 2>&1; then
            rag-eval corpus-check
          else
            echo "Hansard PDFs not in this checkout (gitignored) — skipping"
          fi
